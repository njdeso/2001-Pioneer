# Verification only: install, typecheck, unit tests, build, and security-rules tests on the
# Firebase emulator (demo project, no credentials). This workflow has no secrets and no deploy step,
# and never contacts pioneer-285cf or pioneer-2001-dev. Dev deploys: deploy-dev.yml.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The Firestore/Storage emulators need Java 21+.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: npm install
        run: npm install --no-audit --no-fund

      - name: Dev deploy configuration agrees (workflow, setup script, .firebaserc)
        run: node scripts/check-dev-wif-config.mjs

      - name: Netlify preview build refuses missing or non-dev configuration
        run: node --test scripts/netlify-dev-build.test.mjs

      - name: Dev-only seeding guard refuses production
        run: node --test scripts/lib/dev-guard.test.mjs

      - name: Dev ledger audit is read-only and catches unbalanced reversals
        run: node --test scripts/audit-dev-ledger.test.mjs

      - name: Ledger and posted statements are append-only (smoke, seed, functions)
        run: node --test scripts/ledger-append-only.test.mjs

      - name: Production backup scripts fail closed and only verify by restore (fake gcloud, no Google access)
        run: node --test scripts/prod-backup.test.mjs scripts/prod-backup-restore-test.test.mjs scripts/prod-fingerprint.test.mjs scripts/prod-preflight-compare.test.mjs scripts/inspect-statement-xlsx.test.mjs

      - name: Cloud Functions runtime dependencies load from a clean install (as Cloud Functions installs them)
        run: |
          mkdir -p /tmp/fn-deps && cp functions/package.json /tmp/fn-deps/ && cd /tmp/fn-deps
          npm install --omit=dev --no-audit --no-fund
          node -e "Promise.all([import('exceljs'), import('pdfjs-dist/legacy/build/pdf.mjs')]).then(([x]) => { if (typeof (x.default ?? x).Workbook !== 'function') throw new Error('exceljs Workbook missing'); console.log('exceljs and pdfjs-dist load'); })"

      - name: npm run typecheck
        run: npm run typecheck

      - name: npm run test
        run: npm run test

      - name: npm run build
        run: npm run build

      # 1,600 synthetic customers through the real callable (auth + firestore + functions emulators, demo
      # project, no credentials). The secret and parameter files only satisfy the emulator (it would otherwise
      # prompt for them and wait); no function under test uses them.
      - name: Customer & Policy Export end to end with 1,600 synthetic customers (emulators, .xlsx)
        timeout-minutes: 12
        run: |
          printf 'ANTHROPIC_API_KEY=emulator-only-not-a-key\n' > functions/.secret.local
          printf 'OWNER_EMAILS=owner@example.test\n' > functions/.env.demo-asm-export
          npx firebase emulators:exec --only auth,firestore,functions --project demo-asm-export "node --import tsx --test scripts/book-export-emulator.test.mjs"

      # Correction history of AI-extracted values survives statement re-reads (real replaceLines and
      # audit writer, Firestore emulator, demo project, synthetic statement).
      - name: AI-value correction history survives re-reads (Firestore emulator)
        timeout-minutes: 5
        run: npx firebase emulators:exec --only firestore --project demo-asm-audit "node --import tsx --test scripts/ai-correction-audit-emulator.test.mjs"

      - name: Function endpoints match the app and smoke test (region, callable, options)
        run: node scripts/check-functions-endpoints.mjs

      - name: npm run test:rules (Firebase emulator, demo project)
        run: npm run test:rules

  # Production Functions are deployed from a Windows PC: run the same local checks as the Windows deploy
  # procedure (install, shared tests, typecheck, Functions build) on Windows, so path handling that only
  # breaks there is caught here, not during a production deploy. Verification only; no deploy, no secrets.
  windows-deploy-checks:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm install (workspaces; the repository has no lockfile)
        run: npm.cmd install --no-audit --no-fund
      - name: Unit tests (shared)
        run: npm.cmd --workspace @asm/shared run test
      - name: Typecheck (shared, functions)
        run: |
          npm.cmd --workspace @asm/shared run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm.cmd --workspace @asm/functions run typecheck
      - name: Build Functions
        run: |
          npm.cmd --workspace @asm/functions run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path functions\lib\index.js)) { throw 'functions\lib\index.js was not produced' }

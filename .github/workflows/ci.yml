# Verification only: install, typecheck, unit tests, build, and security-rules tests on the
# Firebase emulator (demo project, no credentials). This workflow has no secrets and no deploy step,
# and never contacts pioneer-285cf or pioneer-2001-dev. Dev deploys: deploy-dev.yml.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The Firestore/Storage emulators need Java 21+.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: npm install
        run: npm install --no-audit --no-fund

      - name: Dev deploy configuration agrees (workflow, setup script, .firebaserc)
        run: node scripts/check-dev-wif-config.mjs

      - name: npm run typecheck
        run: npm run typecheck

      - name: npm run test
        run: npm run test

      - name: npm run build
        run: npm run build

      - name: npm run test:rules (Firebase emulator, demo project)
        run: npm run test:rules

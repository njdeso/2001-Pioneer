[build]
  base = "/"
  command = "npm install && npm --workspace @asm/admin run build"
  publish = "apps/admin/dist"

[build.environment]
  NODE_VERSION = "22"

# Pull-request previews and branch deploys must never talk to production (pioneer-285cf).
# They are built by scripts/netlify-dev-build.mjs against the development project, pioneer-2001-dev.
# The dev web API key and app ID are NOT in this public repo: they come from the Netlify environment
# variables DEV_FIREBASE_API_KEY and DEV_FIREBASE_APP_ID (Deploy Previews + Branch deploys contexts).
# If they are missing or belong to another project, the build fails with an explicit error. It never
# falls back to the production values.
# The blank VITE_ values below are a second safeguard: values in this file override the Netlify UI, so
# even a preview built some other way can never pick up the production key.
# The production context is not overridden: it keeps the normal build command and the UI values.
[context.deploy-preview]
  command = "npm install && node scripts/netlify-dev-build.mjs"
[context.deploy-preview.environment]
  VITE_FIREBASE_PROJECT_ID = "pioneer-2001-dev"
  VITE_FIREBASE_AUTH_DOMAIN = "pioneer-2001-dev.firebaseapp.com"
  VITE_FIREBASE_STORAGE_BUCKET = "pioneer-2001-dev.firebasestorage.app"
  VITE_FIREBASE_API_KEY = ""
  VITE_FIREBASE_APP_ID = ""
  VITE_FUNCTIONS_REGION = "us-central1"
  VITE_USE_EMULATORS = "false"

[context.branch-deploy]
  command = "npm install && node scripts/netlify-dev-build.mjs"
[context.branch-deploy.environment]
  VITE_FIREBASE_PROJECT_ID = "pioneer-2001-dev"
  VITE_FIREBASE_AUTH_DOMAIN = "pioneer-2001-dev.firebaseapp.com"
  VITE_FIREBASE_STORAGE_BUCKET = "pioneer-2001-dev.firebasestorage.app"
  VITE_FIREBASE_API_KEY = ""
  VITE_FIREBASE_APP_ID = ""
  VITE_FUNCTIONS_REGION = "us-central1"
  VITE_USE_EMULATORS = "false"

# Single-page app routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Robots-Tag = "noindex, nofollow"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://apis.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://*.googleapis.com https://*.cloudfunctions.net https://*.run.app https://*.firebaseio.com wss://*.firebaseio.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com; frame-src https://*.firebaseapp.com https://storage.googleapis.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
